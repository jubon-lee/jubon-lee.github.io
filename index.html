<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="이주본의 개인 홈페이지" />
    <title>이주본 | 개인 홈페이지</title>
    <style>
      :root { --ink: #15263f; --blue: #2563eb; --sky: #eaf3ff; --line: #dbe5f0; --muted: #5e6f82; }
      * { box-sizing: border-box; }
      body { margin: 0; color: var(--ink); background: #f8fbff; font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.65; }
      main { width: min(100% - 2.5rem, 880px); margin: 0 auto; padding: clamp(3rem, 10vw, 7rem) 0 4rem; }
      .intro { display: grid; grid-template-columns: auto 1fr; gap: 1.5rem; align-items: center; padding-bottom: 3.25rem; }
      .monogram { display: grid; width: 5.75rem; height: 5.75rem; place-items: center; border-radius: 1.75rem; color: white; background: var(--ink); font-size: 1.65rem; font-weight: 800; letter-spacing: -0.12em; }
      .eyebrow { margin: 0 0 0.3rem; color: var(--blue); font-size: 0.82rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; }
      h1, h2, p { margin-top: 0; }
      h1 { margin-bottom: 0.15rem; font-size: clamp(2rem, 7vw, 3.4rem); letter-spacing: -0.07em; line-height: 1.15; }
      .subtitle { margin: 0; color: var(--muted); font-size: 1.05rem; }
      .grid { display: grid; grid-template-columns: 1.25fr 0.75fr; gap: 1.1rem; }
      .card { padding: clamp(1.5rem, 4vw, 2.2rem); border: 1px solid var(--line); border-radius: 1.4rem; background: white; }
      .card--accent { border-color: transparent; background: var(--ink); color: white; }
      h2 { margin-bottom: 1rem; font-size: 1.05rem; letter-spacing: -0.03em; }
      .card--accent h2 { color: #9fc3ff; }
      .card p { margin-bottom: 0; font-size: 1.05rem; }
      .pills { display: flex; flex-wrap: wrap; gap: 0.55rem; padding: 0; margin: 0; list-style: none; }
      .pills li { padding: 0.43rem 0.75rem; border-radius: 999px; background: var(--sky); color: #1f4d94; font-size: 0.94rem; font-weight: 700; }
      .card--accent .pills li { background: #253c5b; color: #e8f1ff; }
      footer { margin-top: 3.25rem; color: var(--muted); font-size: 0.88rem; }
      @media (max-width: 620px) { main { width: min(100% - 2rem, 880px); padding-top: 3rem; } .intro { grid-template-columns: 1fr; gap: 1rem; padding-bottom: 2.3rem; } .monogram { width: 4.5rem; height: 4.5rem; border-radius: 1.35rem; } .grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main>
      <header class="intro">
        <div class="monogram" aria-hidden="true">JB</div>
        <div><p class="eyebrow">Personal note</p><h1>이주본</h1><p class="subtitle">배우고, 관찰하고, 차분히 만들어 갑니다.</p></div>
      </header>
      <section class="grid" aria-label="소개">
        <article class="card"><h2>About me</h2><p>INTP입니다. 사람들의 삶을 더 편리하고 건강하게 만드는 기술에 관심이 많아 디지털헬스케어 전공을 희망하고 있습니다.</p></article>
        <article class="card card--accent"><h2>Interests</h2><ul class="pills"><li>디지털헬스케어</li><li>새로운 배움</li></ul></article>
        <article class="card card--accent"><h2>Hobbies</h2><ul class="pills"><li>야구 보기</li><li>드럼 치기</li></ul></article>
        <article class="card"><h2>Now</h2><p>관심 있는 분야를 탐색하며, 나만의 첫 번째 홈페이지를 만들어 가는 중입니다.</p></article>
      </section>
      <footer>© 2026 이주본</footer>
    </main>
  </body>
</html>
